name: Builds - Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resource-cleanup-proof-contract:
    name: Windows resource cleanup proof contract
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exercise private return evidence fixtures
        shell: pwsh
        run: ./scripts/test-windows-resource-proof.ps1

  windows-cleanup-contract:
    name: Windows cleanup contract
    if: ${{ always() }}
    needs: [resource-cleanup-proof-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require cleanup fixture coverage
        shell: bash
        env:
          CONTRACT_RESULT: ${{ needs.resource-cleanup-proof-contract.result }}
        run: |
          set -euo pipefail
          if [[ "${CONTRACT_RESULT}" != success ]]; then
            echo "::error::Windows cleanup fixtures finished with ${CONTRACT_RESULT}."
            exit 1
          fi
          echo 'The fork runs cleanup fixtures without organization Unity credentials.'
